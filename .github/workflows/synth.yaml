name: Synth (LibreLane)

on:
  push:
    branches:
      - digital-layout-shrink
  workflow_dispatch:

jobs:
  librelane:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install AppImage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Download LibreLane AppImage (3.0.2)
        run: |
          curl -sSL -o librelane.AppImage \
            https://github.com/librelane/librelane/releases/download/3.0.2/librelane-devshell-x86_64.AppImage
          chmod +x librelane.AppImage
          ./librelane.AppImage --appimage-extract >/dev/null
          ls squashfs-root/bin | head -5 || true

      - name: Run LibreLane flow
        working-directory: rtl
        run: |
          ../squashfs-root/AppRun librelane --pdk-root $HOME/.volare config.json

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p /tmp/out
          if [ -d rtl/runs ]; then
            latest=$(ls -td rtl/runs/*/ | head -1)
            cp -r "$latest/final" /tmp/out/final || true
            cp "$latest/final_summary.log" /tmp/out/ 2>/dev/null || true
            cp -r "$latest" /tmp/out/full_run || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: librelane-run
          path: /tmp/out/
          retention-days: 7
